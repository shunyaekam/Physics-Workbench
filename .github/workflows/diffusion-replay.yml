name: Replay planar first-hit counting proof
on:
  push:
    branches: [lts-diffusion-count-replay]
permissions:
  contents: read
jobs:
  pinned-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: 9097e2f90e66d2f6244209cb1c07f7120d17ec53
          path: fc
      - id: restored
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            fc/.lake
          key: lts-optics-9097e2f9
      - name: Prepare pinned Lean
        working-directory: fc
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan.sh"
            sh "$RUNNER_TEMP/elan.sh" -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [ ! -f .lake/build/lib/lean/FormalConjectures/ErdosProblems/1165.olean ]; then lake exe cache get; fi
          lake build FormalConjecturesUtil
          mkdir -p .lake/build/lib/lean/FormalConjectures/ErdosProblems
          lake env lean -o .lake/build/lib/lean/FormalConjectures/ErdosProblems/1165.olean FormalConjectures/ErdosProblems/1165.lean
      - uses: actions/cache/save@v4
        if: steps.restored.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.elan
            fc/.lake
          key: lts-optics-9097e2f9
      - name: Check first-hit counting and discounted renewal and inspect their axioms
        working-directory: fc
        run: |
          set -o pipefail
          cp ../checks/left_to_solve/attempts/diffusion/Cylinder.lean Cylinder.lean
          printf '\n#print axioms DiffusionCylinder.first_hit_count\n' >> Cylinder.lean
          lake env lean Cylinder.lean | tee "$RUNNER_TEMP/cylinder.log"
          grep -Fx "'DiffusionCylinder.first_hit_count' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/cylinder.log"
          cp ../checks/left_to_solve/attempts/diffusion/Discount.lean Discount.lean
          printf '\n#print axioms DiffusionDiscount.discounted_renewal\n' >> Discount.lean
          lake env lean Discount.lean | tee "$RUNNER_TEMP/discount.log"
          grep -Fx "'DiffusionDiscount.discounted_renewal' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/discount.log"
          cp ../checks/left_to_solve/attempts/diffusion/Split.lean Split.lean
          printf '\n#print axioms DiffusionSplit.joinEquiv\n' >> Split.lean
          lake env lean Split.lean | tee "$RUNNER_TEMP/split.log"
          grep -Fx "'DiffusionSplit.joinEquiv' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/split.log"
