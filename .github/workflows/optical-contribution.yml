name: Optical proof development
on:
  push:
    branches: [lts-kernel-review]
    paths: ['checks/left_to_solve/Optics.lean', '.github/workflows/optical-contribution.yml']
permissions:
  contents: read
jobs:
  pinned-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/formal-conjectures
          ref: 9097e2f90e66d2f6244209cb1c07f7120d17ec53
          path: fc
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            fc/.lake
          key: lts-optics-9097e2f9
      - name: Prepare the reduction library
        working-directory: fc
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan.sh"
            sh "$RUNNER_TEMP/elan.sh" -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          mkdir -p OMAReductions
          curl -fsSL --retry 3 https://raw.githubusercontent.com/GuillaumeBAUD-coder/open-math-agents/79fd4c3d8dbfc9e8a1f1e621c19c0757b18c0dd9/reductions/MonochromaticQuantumGraph.eqSystem6_no_solution_ge3.R1.lean -o OMAReductions/R_MonochromaticQuantumGraph_eqSystem6_no_solution_ge3_R1.lean
          printf '\n[[lean_lib]]\nname = "OMAReductions"\nglobs = ["OMAReductions.+"]\n' >> lakefile.toml
          lake build OMAReductions.R_MonochromaticQuantumGraph_eqSystem6_no_solution_ge3_R1
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.elan
            fc/.lake
          key: lts-optics-9097e2f9
      - name: Replay the two public proof files
        working-directory: fc
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/shunyaekam/open-math-agents/e5491fee6c7a1050a428425b922e52b97a665164/proofs/MonochromaticQuantumGraph.eqSystem6_no_solution_ge3.R1.H1.lean -o H1.source
          echo '24fb1d83c50531a810858756b8af9f2df2c787ae00d9bf9ad05409833879c5ce  H1.source' | sha256sum -c -
          sed 's/^theorem OMA\.solution :/theorem OOReplay.h1 :/' H1.source > OOReplayH1.lean
          lake env lean -o .lake/build/lib/lean/OOReplayH1.olean OOReplayH1.lean
          curl -fsSL --retry 3 https://raw.githubusercontent.com/shunyaekam/open-math-agents/d8d7370dc10f2ac6114f7bf972cb48666e027677/proofs/MonochromaticQuantumGraph.eqSystem6_no_solution_ge3.R1.H2.lean -o H2.source
          echo '244af9acb52ac401bcb271d4b9210517a137ee0b0a28241a2dfffa8488cdc494  H2.source' | sha256sum -c -
          sed 's/^theorem OMA\.solution :/theorem OOReplay.h2 :/' H2.source > OOReplayH2.lean
          lake env lean -o .lake/build/lib/lean/OOReplayH2.olean OOReplayH2.lean
      - name: Audit the complete six-photon theorem
        working-directory: fc
        run: |
          set -euo pipefail
          lake env lean ../checks/left_to_solve/Optics.lean | tee "$RUNNER_TEMP/parent-proof.log"
          grep -Fx "'OOReplay.sixPhotonNoGo' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/parent-proof.log"
